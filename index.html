<!DOCTYPE html>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      padding: 20px;
      background-color: #333;
      margin: 0;
    }
    .section {
      padding: 20px;
    }
    .products {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .product {
      background-color: #222;
      padding: 15px;
      border-radius: 10px;
      width: 200px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .product img {
      width: 100%;
      border-radius: 5px;
    }
    .product button {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      background-color: #ffcc00;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    /* Brillo y movimiento solo para productos nuevos */
    .new .product {
      border: 3px solid gold;
      box-shadow: 0 0 15px gold;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
