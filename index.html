<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store of Brainrots</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle at top, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 3px 3px 10px #000;
      animation: glow 2s infinite alternate;
    }

    p.intro {
      font-size: 1.3em;
      margin-bottom: 30px;
      text-shadow: 1px 1px 3px #000;
    }

    /* Animación de glow */
    @keyframes glow {
      0% { text-shadow: 0 0 5px #ff0, 0 0 10px #ff0, 0 0 20px #ff0; }
      100% { text-shadow: 0 0 20px #ff0, 0 0 40px #ff0, 0 0 60px #ff0; }
    }

    .products-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .product {
      background-color: rgba(255, 255, 255, 0.1);
      border: 2px solid #fff;
      border-radius: 15px;
      width: 220px;
      padding: 15px;
      transition: transform 0.5s, background-color 0.3s, box-shadow 0.5s;
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .product::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, rgba(255,255,0,0.2), rgba(255,0,255,0.2), rgba(0,255,255,0.2), rgba(255,255,0,0.2));
      animation: rotate 6s linear infinite;
      z-index: 0;
      opacity: 0.3;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .product img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: transform 0.5s;
      z-index: 1;
      position: relative;
    }

    .product:hover img {
      transform: rotate(10deg) scale(1.15);
    }

    h3 {
      margin-bottom: 5px;
      font-size: 1.3em;
      text-shadow: 2px 2px 5px #000;
      position: relative;
      z-index: 1;
    }

    .product p {
      font-size: 1em;
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #ffcc00, #ff6600);
      color: #000;
      font-weight: bold;
      font-size: 1em;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      z-index: 1;
    }

    button:hover {
      transform: scale(1.2);
      box-shadow: 0 0 15px #ffcc00, 0 0 30px #ff6600;
    }

    /* Destacado */
    .highlight {
      border: 3px solid gold;
      box-shadow: 0 0 15px gold;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Responsive */
    @media (max-width: 700px) {
      .products-container {
        flex-direction: column;
        align-items: center;
      }

      .product {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <h1>Store of Brainrots</h1>
  <p class="intro">¡La tienda más épica y confiable para tus Brainrots favoritos!</p>

  <div class="products-container">
    <div class="product highlight" onclick="window.location.href='https://www.roblox.com/es/game-pass/1511491002/Graipuss-Medussi'">
      <img src="https://tr.rbxcdn.com/180DAY-eab35ca8b8a849f793a0196c9f4c6920/420/420/BackAccessory/Webp/noFilter" alt="Graipuss Medussi">
      <h3>Graipuss Medussi</h3>
      <p>Da 1M/s</p>
      <button>Comprar</button>
    </div>

    <div class="product" onclick="window.location.href='https://www.roblox.com/es/game-pass/1510629712/Job-Job-Job-Sahur'">
      <img src="https://tr.rbxcdn.com/180DAY-0e1869f8333d3d4ea2693f280ee93c18/420/420/Hat/Webp/noFilter" alt="Job Job Job Sahur">
      <h3>Job Job Job Sahur</h3>
      <p>Da 700K/s</p>
      <button>Comprar</button>
    </div>

    <div class="product" onclick="window.location.href='https://www.roblox.com/es/game-pass/1511493239/La-Grande-Combinasion'">
      <img src="https://production-gameflipusercontent.fingershock.com/us-east-1:8e4a1321-7067-4ac5-8c93-deb12d4b1ad5/85cf3be7-37d6-4171-b144-830be455668a/88e4ee11-61ed-4a14-9056-d6085b91a8ce/640x640.webp" alt="La Grande Combinasion">
      <h3>La Grande Combinasion</h3>
      <p>Da 10M/s</p>
      <button>Comprar</button>
    </div>
  </div>

</body>
</html>
