<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Store of Brainrots</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #222);
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      padding: 20px;
      background-color: #111;
      color: gold;
      font-size: 2.5em;
      letter-spacing: 2px;
      text-shadow: 2px 2px #000;
      margin: 0;
    }
    .section {
      padding: 30px 10px;
    }
    .products {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }
    .product {
      background-color: #222;
      padding: 15px;
      border-radius: 15px;
      width: 220px;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }
    .product:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 20px gold;
    }
    .product img {
      width: 100%;
      border-radius: 10px;
    }
    .product h3 {
      margin: 10px 0 5px;
      font-size: 1.2em;
    }
    .product p {
      margin: 5px 0;
      font-weight: bold;
      color: #ffcc00;
    }
    .product button {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      background-color: #ffcc00;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .product button:hover {
      background-color: #e6b800;
    }
    .stars {
      color: gold;
      margin: 5px 0;
    }
    .verified {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: gold;
      color: #000;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 5px;
      font-size: 0.8em;
    }
    /* Nuevos productos destacados */
    .new .product {
      border: 3px solid gold;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
